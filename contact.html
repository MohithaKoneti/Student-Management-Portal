
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Contact - Student Management Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Management Portal</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="registration.html">Student Registration</a>
            <a href="courses.html">Courses</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Contact Us</h2>
        <p>If you have any questions, please contact us.</p>

        <p><strong>Email:</strong> studentportal@example.com</p>
        <p><strong>Phone:</strong> 98765 43210</p>

        <h3>Send Us a Message</h3>
        <form>
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            <br><br>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <p>Student Management Portal</p>
    </footer>
</body>
</html>
